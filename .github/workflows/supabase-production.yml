name: Workforce Supabase Production Migrations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-production.yml"
      - "scripts/apply-supabase-migrations.mjs"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply committed migrations
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_MIGRATION_START_VERSION: ${{ vars.SUPABASE_MIGRATION_START_VERSION }}
    steps:
      - name: Check out the GitHub commit
        uses: actions/checkout@v4

      - name: Require production secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_MIGRATION_START_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate committed migrations
        run: node scripts/apply-supabase-migrations.mjs --check

      - name: Preview committed migrations
        run: node scripts/apply-supabase-migrations.mjs --preview

      - name: Apply committed migrations
        run: node scripts/apply-supabase-migrations.mjs --apply
